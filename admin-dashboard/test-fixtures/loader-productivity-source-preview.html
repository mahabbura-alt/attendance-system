<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loader Productivity Source Preview</title>
  <link rel="stylesheet" href="../style.css?v=61">
  <style>body{margin:0;background:#f6f5f1;font-family:Arial,sans-serif}.preview-shell{max-width:1500px;margin:28px auto;padding:0 20px}.preview-shell>h1{color:#0f172a;margin-bottom:4px}.preview-shell>p{color:#64748b;margin-top:0}.tab-konten{display:block!important}</style>
</head>
<body>
  <main class="preview-shell">
    <h1>OB Productivity Planning</h1>
    <p>Verifikasi Loader Productivity sebagai target dan Setting Fleet Simulation non-periode.</p>
    <button id="btnAddPlanProductivityTable">+ Tambah Fleet</button>
    <section class="tab-konten"><div id="planProductivityTables" data-plan-productivity-container="ob"></div></section>
    <output id="runtime">Memuat…</output>
  </main>
  <script>
    window.getProdApiUrl = path => path;
    window.getProdAuthHeaders = () => ({});
    const planningData = {
      version: 8,
      parameters: [{id:'mat-clay',material:'CLAY',fill:0.9,swell:1.3,density:null}],
      fleets: [{loaderId:'ex-1',loaderCode:'EX30 350-14'}],
      scenarios: [{id:'loader-1',loaderId:'ex-1',loaderCode:'EX30 350-14',material:'CLAY',jobCodes:['OB'],cycleTimeLoading:25,workEffLoader:0.72,loaderProductivity:180}],
      loaderCatalog: [{planRef:'ob:loader:loader-1:OB',tableId:'loader-1',planningType:'ob',jobCode:'OB',loaderCode:'EX30 350-14',material:'CLAY',loaderProductivity:180,fleetProductivity:180,complete:true,productivityUnit:'BCM/Hr',targetSource:'loader_productivity'}],
      haulerRows: [{loaderId:'ex-1',truckId:'dt-1',material:'CLAY',capacity:12,capacityUom:'BCM',loadedSpeed:20,emptySpeed:30,spotDumpTime:2,workEfficiency:0.75}],
      distanceHeadersMeters:[500,1000,1500,2000]
    };
    window.fetch = async url => {
      const value=String(url);
      if(value.includes('/spo-jobs/deployed')) return new Response(JSON.stringify([{jobCode:'OB',jobDescription:'Overburden Removal'}]),{status:200,headers:{'Content-Type':'application/json'}});
      if(value.includes('/productivity-plans/ob')) return new Response(JSON.stringify({planningData,effectiveFrom:'2026-09-01',revision:3,periodEnd:'2026-12-31'}),{status:200,headers:{'Content-Type':'application/json'}});
      return new Response('{}',{status:404});
    };
  </script>
  <script src="../planProductivity.workspace.js?v=6"></script>
  <script>
    (async()=>{
      try {
        PlanProductivity.setFleetOptions([{id:'ex-1',code:'EX30 350-14',classUnit:'EX 30 T',type:'HITACHI ZX350',capacity:2.1,capacityUom:'BCM',active:true}]);
        PlanProductivity.setDumpTruckOptions([{id:'dt-1',code:'DT30 130',classUnit:'DT 30 T',type:'SANY 430',capacity:12,capacityUom:'BCM',active:true}]);
        await PlanProductivity.initPlanProductivityModule();
        document.querySelector('[data-view="setting"]').click();
        document.getElementById('runtime').textContent='Runtime: OK';
      } catch(error) { document.getElementById('runtime').textContent='Runtime: '+error.message; }
    })();
  </script>
</body>
</html>
