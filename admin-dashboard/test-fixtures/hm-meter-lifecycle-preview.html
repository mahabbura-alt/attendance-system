<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><title>HM Meter Lifecycle Preview</title></head>
<body style="margin:0;background:#f8f7f3;color:#0f172a;font-family:Arial,sans-serif;"><main style="max-width:1180px;margin:24px auto;padding:0 18px;">
  <section style="background:#fff;border:1px solid #dbe7f5;border-radius:14px;padding:18px;box-shadow:0 5px 18px rgba(15,23,42,.06);">
    <div style="display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;"><div><h2 style="margin:0;">📝 Input Data Produksi (Daily Work Log)</h2><p style="margin:5px 0 0;color:#64748b;font-size:13px;">Pencatatan jam kerja unit dan kesinambungan HM.</p></div><div style="display:flex;gap:8px;"><button class="tombol" disabled>Simpan Perubahan</button><button class="tombol tombol--utama">+ Insert Data</button><button id="previewHmButton" class="tombol" style="border-color:#2563eb;color:#1d4ed8;background:#eff6ff;font-weight:800;">⚙ HM Meter</button></div></div>
  </section>
  <section id="previewModal" style="margin-top:18px;background:#fff;border:1px solid #cbd5e1;border-radius:14px;padding:20px;box-shadow:0 18px 50px rgba(15,23,42,.14);">
    <div style="display:flex;justify-content:space-between;gap:12px;"><div><h3 style="margin:0;">⚙ Penggantian / Reset HM Meter</h3><p style="margin:5px 0 14px;color:#64748b;font-size:12px;">Pembacaan fisik tetap non-negatif; sistem membentuk Lifetime HM.</p></div><button class="tombol">✕</button></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;"><label class="label">Kode Unit<select class="input-filter"><option>WL30 10-01 — WL CAT 950 GC</option></select></label><label class="label">Jenis Event<select class="input-filter"><option>Penggantian Meter</option></select></label><label class="label">Tanggal Efektif<input class="input-filter" type="date" value="2026-09-30"></label><label class="label">Shift Efektif<select class="input-filter"><option>Shift Siang</option></select></label><label class="label">HM Akhir Meter Lama<input class="input-filter" value="51.00"></label><label class="label">HM Awal Meter Baru<input class="input-filter" value="0.00"></label></div>
    <label class="label" style="display:block;margin-top:10px;"><span style="display:block;margin-bottom:5px;">Alasan / Referensi Pekerjaan</span><textarea class="input-filter" rows="2" style="display:block;width:100%;box-sizing:border-box;">Penggantian hour meter unit</textarea></label>
    <div style="margin-top:12px;border:1px solid #dbeafe;border-radius:8px;background:#f8fafc;padding:10px;font-size:12px;color:#475569;"><b style="color:#1e3a8a;">Riwayat meter unit</b><div style="margin-top:7px;">30 Sep 26 · Shift Siang — Meter 51 → 0 · Offset Lifetime 51</div></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;"><button class="tombol">Batal</button><button class="tombol tombol--utama">Simpan Event HM</button></div>
  </section>
</main></body></html>
