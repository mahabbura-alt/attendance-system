          mockP5mTargets.push(newTgt);

          return new Response(JSON.stringify(mockStScope), { status: 200, headers: { 'Content-Type': 'application/json' } });

        return new Response(JSON.stringify(mockStScope), {

        return new Response(JSON.stringify(mockStTargets), {
          status: 200, headers: { 'Content-Type': 'application/json' }
        });

      if (urlStr.includes('/api/hse/inspections/schedules')) {
        if (opts.method === 'POST') {
          const body = JSON.parse(opts.body || '{}');
          const tmpl = mockInspectionTemplates.find(t => t.id === body.template_root_id || t.root_id === body.template_root_id);
          const loc = mockMasters.locations.find(l => l.id === body.location_id);
          const pos = mockMasters.positions.find(p => p.id === body.assignee_position_id);
          const emp = mockMasters.employees.find(e => e.id === body.assignee_employee_id);
          const newSched = {
            id: 'sch-' + Date.now(),
            template_root_id: body.template_root_id,
            template_name: tmpl?.name || 'Inspeksi',

      return originalFetch(url, opts);
