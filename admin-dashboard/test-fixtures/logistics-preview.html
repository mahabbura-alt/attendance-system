<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMOS Logistik — Isolated integration preview</title><link rel="stylesheet" href="../logistics.css"><style>body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif}.preview{background:#142b41;color:white;padding:12px 24px;font-size:12px;display:flex;justify-content:space-between;gap:12px}.preview button{background:#d7eee7;border:0;padding:6px 12px;border-radius:4px;cursor:pointer}#logisticsRoot{padding:30px;max-width:1600px;margin:auto}@media(max-width:650px){#logisticsRoot{padding:14px}.preview{flex-wrap:wrap}}</style></head><body><div class="preview"><span>OMOS · LOGISTIK · Data uji terisolasi — tanpa koneksi database produksi</span><button id="switchActor">Ganti Planner / Reviewer</button></div><div id="logisticsRoot"></div><script src="../ui-action-feedback.js"></script><script src="../logistics.js"></script><script>(async()=>{const sessions=await fetch('/__fixture/session').then(r=>r.json());let actor=sessionStorage.getItem('fixtureActor')||'planner';function login(){localStorage.setItem('admin_token',sessions[actor]);localStorage.setItem('admin_email',actor+'@example.invalid');OMOSLogistics.load();}document.getElementById('switchActor').onclick=()=>{actor=actor==='planner'?'reviewer':'planner';sessionStorage.setItem('fixtureActor',actor);login();};login();})();</script></body></html>
