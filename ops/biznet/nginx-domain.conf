# Canonical OMOS domain. The existing IP virtual host remains active for
# backward compatibility with already-distributed APK builds.
server {
    listen 80;
    listen [::]:80;
    server_name omos-mining.com www.omos-mining.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://omos-mining.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.omos-mining.com;

    ssl_certificate /etc/letsencrypt/live/omos-mining.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omos-mining.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://omos-mining.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name omos-mining.com;

    ssl_certificate /etc/letsencrypt/live/omos-mining.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omos-mining.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), geolocation=(self)" always;

    access_log /var/log/nginx/omos-domain-access.log;
    error_log /var/log/nginx/omos-domain-error.log warn;

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/omos-api-maintenance.conf;
        limit_req zone=omos_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    location = /Absensi_PIM.apk {
        proxy_pass http://127.0.0.1:3000/Absensi_PIM.apk;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /download-apk {
        proxy_pass http://127.0.0.1:3000/download-apk;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /mobile-web/ {
        alias /opt/omos/current/mobile-web/;
        try_files $uri =404;
    }

    location ^~ /mobile/ {
        alias /opt/omos/current/mobile-web/;
        try_files $uri $uri/ /mobile-web/index.html;
    }

    location = /mobile {
        try_files /mobile-web/index.html =404;
        root /opt/omos/current;
    }

    location = /portal {
        try_files /mobile-web/index.html =404;
        root /opt/omos/current;
    }

    location = /karyawan {
        try_files /mobile-web/index.html =404;
        root /opt/omos/current;
    }

    location = /karyawan.html {
        try_files /mobile-web/index.html =404;
        root /opt/omos/current;
    }

    location = /karyawan.js {
        try_files /mobile-web/karyawan.js =404;
        root /opt/omos/current;
    }

    location / {
        root /opt/omos/current/admin-dashboard;
        try_files $uri $uri/ /index.html;
    }
}
